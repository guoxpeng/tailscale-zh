name: Build PC (Windows) Chinese Installer

# 推送到 pc 分支或手动触发时（**只构建、不发版**）：
#   拉官方 MSI → 解出原始 tailscale-ipn.exe → 校验 SHA256 → 打汉化补丁
#   → 校验产物 → Inno Setup 编译向导式安装包 → 上传 Artifact
#
# 发版已统一到 main 分支的 .github/workflows/release.yml：
#   打一个 v<版本号> 标签即可同时出 APK 和 exe（exe 由那条流水线检出本分支构建）。
# 旧的 pc-v* 标签发版已移除，避免与 release.yml 重复发版。
# 改动本文件的构建步骤时，请同步 main 分支 release.yml 里的 windows 作业。

on:
  push:
    branches: [ pc ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  TS_VERSION: "1.104.1"
  TS_MSI_URL: "https://pkgs.tailscale.com/stable/tailscale-setup-1.104.1-amd64.msi"
  # 官方 MSI 整包 SHA256（= pkgs.tailscale.com 公布的 .sha256）。MSI 会被内嵌进安装包、
  # 在用户机器上以管理员身份执行，必须钉死整包，不能只校验解出来的 exe。
  # 与 installer/tailscale-zh.iss 的 MsiSha256、main 分支 release.yml 保持一致。
  TS_MSI_SHA256: "6da8bcdb0d45a214cae0e8a88c2987ad48dec134bf04dffb9c05f1354c02b0b4"
  # 官方 MSI 内 ClientGUIx64（= tailscale-ipn.exe）的 SHA256。
  # 偏移补丁必须打在完全一致的源文件上，不一致直接失败。
  TS_ORIG_SHA256: "0c3c56a6626c9f71a32fb307dbda0c810c94a89d66fed158258da6f043004f9c"
  INNO_VERSION: "6.7.3"
  INNO_URL: "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
  # innosetup-6.7.3.exe 的 SHA256（= jrsoftware/issrc 该 Release 资产的 digest）
  INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
  # Windows runner 的默认控制台编码不是 UTF-8，脚本打印中文会 UnicodeEncodeError
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: 构建汉化安装包
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: python -m pip install --disable-pip-version-check --no-cache-dir "capstone==5.0.9"

      - name: Download official Tailscale MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fsSL --proto '=https' --tlsv1.2 -o tailscale-setup.msi "$env:TS_MSI_URL"
          Get-Item tailscale-setup.msi | Format-List Name, Length
          $h = (Get-FileHash tailscale-setup.msi -Algorithm SHA256).Hash.ToLower()
          Write-Host "MSI SHA256: $h"
          if ($h -ne $env:TS_MSI_SHA256.ToLower()) { throw "官方 MSI 哈希不符（期望 $env:TS_MSI_SHA256）—— 拒绝把它打进安装包" }
          $sig = Get-AuthenticodeSignature tailscale-setup.msi
          Write-Host "MSI 签名: $($sig.Status)  $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Tailscale') {
            throw "官方 MSI 的 Authenticode 签名无效或签名者不是 Tailscale"
          }

      - name: Extract tailscale-ipn.exe from MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "7z" }
          Remove-Item -Recurse -Force extract -ErrorAction SilentlyContinue
          & $sevenZip x tailscale-setup.msi "-oextract" -y | Out-Null
          Get-ChildItem extract -File | Format-Table Name, Length

      - name: Verify source hash and stage original exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $want = $env:TS_ORIG_SHA256.ToLower()
          $hit = $null
          Get-ChildItem extract -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Host "$h  $($_.Name)"
            if ($h -eq $want) { $hit = $_.FullName }
          }
          if (-not $hit) {
            throw "MSI 中未找到 SHA256=$want 的原始 tailscale-ipn.exe —— 官方可能已换版，需更新 zh_win.tsv 偏移表与本工作流常量。"
          }
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item $hit build\tailscale-ipn.exe
          Write-Host "已定位原始程序: $hit"

      - name: Apply Chinese patch
        run: python tools\build.py build\tailscale-ipn.exe build

      - name: Verify patched binary
        run: python tools\verify.py build\tailscale-ipn.exe build\tailscale-ipn.zh.exe tools\zh_win.tsv

      # prebuilt/ 与 SHA256SUMS.txt 是「手工提交」的成品副本（README 的方式 B/C
      # 让用户直接下载它们），CI 从不过问就没人会发现它们过期。
      # 2026-10-11 就真出过一次：对照表 126 -> 140 条之后 build 产物换了，
      # prebuilt 里那份还是旧的，按方式 B/C 装出来主界面仍是英文。
      # 这里把它变成硬检查：prebuilt 必须与本次构建逐字节一致。
      - name: Verify prebuilt copy is in sync
        run: python tools\prebuilt_check.py build\tailscale-ipn.zh.exe

      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fsSL --proto '=https' --tlsv1.2 -o innosetup.exe "$env:INNO_URL"
          $h = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:INNO_SHA256.ToLower()) { throw "Inno Setup 安装包哈希不符：$h" }
          $p = Start-Process -FilePath .\innosetup.exe -Wait -PassThru -ArgumentList `
               '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/SP-'
          Write-Host "Inno Setup 安装退出码: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Inno Setup 安装失败，退出码 $($p.ExitCode)" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 $iscc" }
          Write-Host "ISCC: $iscc (版本 $((Get-Item $iscc).VersionInfo.ProductVersion))"

      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }
          & $iscc "installer\tailscale-zh.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败，退出码 $LASTEXITCODE" }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Stage release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force release | Out-Null
          # 本流水线只产出 Actions 产物；正式发版由 main 分支 release.yml 负责。
          Copy-Item dist\*.exe release\
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailscale-zh-windows-${{ env.TS_VERSION }}
          path: release/*
          if-no-files-found: error
