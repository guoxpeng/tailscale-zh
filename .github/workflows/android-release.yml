name: 构建安卓汉化 APK

# 仅供手动单独构建 Android APK（workflow_dispatch），**不再发版**。
#
# 发版已统一到 release.yml：打一个 v<版本号> 标签（= android/build.gradle.kts 的 versionName），
# 同一次运行里同时构建 APK 与 Windows 安装包并发到同一个 Release。
# 旧的 android-v* 标签触发已移除，避免与 release.yml 重复发版。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建（仅产物，不发布）
    runs-on: ubuntu-24.04

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      # 上游 1.104 起改用 AGP 9.4 + Gradle 9.6，并在 gradle-daemon-jvm.properties 里
      # 指定 Gradle 守护进程用 JDK 21（与上游 CI 一致）。
      - name: 安装 Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装 Android SDK 与 NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p /opt/android-sdk
          cd /opt/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/
          yes | cmdline-tools/latest/bin/sdkmanager --licenses
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "/opt/android-sdk/build-tools/36.0.0" >> $GITHUB_PATH

      # 用仓库里固定的调试密钥签名，而不是每次随机生成：
      # 随机密钥会导致每个版本的签名都不同，用户无法覆盖安装升级。
      # 这是 Android 调试密钥（口令固定为公开的 android），不用于上架，无泄露风险。
      - name: 安装固定调试签名密钥
        run: |
          mkdir -p $HOME/.android
          cp .ci/android-debug.keystore $HOME/.android/debug.keystore
          keytool -list -keystore $HOME/.android/debug.keystore -storepass android | grep androiddebugkey

      - name: 读取版本号
        id: ver
        run: |
          v=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/build.gradle.kts | head -1)
          test -n "$v" || { echo "未能从 android/build.gradle.kts 读到 versionName"; exit 1; }
          echo "version=$v" >> $GITHUB_OUTPUT
          echo "本次版本号: $v"

      - name: 清理
        run: make clean

      - name: 构建 libtailscale
        run: make libtailscale

      # 不传 -PslimBuild，即构建全架构（arm64-v8a / armeabi-v7a / x86 / x86_64）。
      - name: 构建全架构 APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp build/outputs/apk/debug/android-debug.apk "../Tailscale-zh-${{ steps.ver.outputs.version }}.apk"
          ls -lh "../Tailscale-zh-${{ steps.ver.outputs.version }}.apk"

      - name: 校验签名与版本信息
        run: |
          apk="Tailscale-zh-${{ steps.ver.outputs.version }}.apk"
          echo "===== 签名 ====="
          /opt/android-sdk/build-tools/36.0.0/apksigner verify --verbose "$apk"
          echo "===== 包信息 ====="
          /opt/android-sdk/build-tools/36.0.0/aapt dump badging "$apk" \
            | grep -E "^package|^sdkVersion|^targetSdkVersion|^native-code|^application-label:"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: tailscale-zh-apk-${{ steps.ver.outputs.version }}
          path: Tailscale-zh-${{ steps.ver.outputs.version }}.apk
          retention-days: 30
