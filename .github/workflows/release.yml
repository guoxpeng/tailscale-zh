name: 统一发版（Android APK + Windows 安装包）

# 本仓库唯一的发版入口。一次发版 = 一个标签 = 一个 Release = 两个安装包。
#
#   打 v<版本号> 标签（例如 v1.104.1-fix4，必须与 android/build.gradle.kts 的 versionName 一致）
#     → job android：在 main（即标签所指提交）构建全架构 APK
#     → job windows：用同一提交的 windows/ 目录，拉官方 MSI → 打汉化补丁 → Inno Setup 编译安装包
#     → job publish：两个都成功后，把 apk + exe（+ SHA256SUMS.txt）一起发到 Release v<版本号>
#
#   手动触发（workflow_dispatch）：只构建、上传 Actions 产物，**不发布** Release。
#
# 旧的单端触发（android-v* / pc-v* 标签）已停用发版，只保留手动构建，避免重复发版。
#
# 版本号说明：
#   · 发版版本号 = android/build.gradle.kts 的 versionName（如 1.104.1-fix4），
#     exe 资产名也带同一个标签：Tailscale-zh-<versionName>-setup.exe。
#   · 安装包内部登记的官方组件版本**仍是 1.104.1**（windows/installer/tailscale-zh.iss 的
#     MyTsVersion，以及下面的 TS_VERSION）—— 汉化补丁按官方 1.104.1 的精确偏移生成，
#     这里只改「对外的文件名」，不动安装包内部的版本硬编码。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 默认只读；只有 publish 作业申请写权限。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # ===== Windows 端常量（与 build-pc-installer.yml、windows/installer/tailscale-zh.iss 保持一致）=====
  TS_VERSION: "1.104.1"
  TS_MSI_URL: "https://pkgs.tailscale.com/stable/tailscale-setup-1.104.1-amd64.msi"
  # 官方 MSI 整包的 SHA256（与 pkgs.tailscale.com 发布的 .sha256 一致）。
  # MSI 会被**内嵌进安装包、在用户机器上以管理员身份执行**，所以必须钉死整包哈希，
  # 不能只校验从里面解出来的那个 exe。
  TS_MSI_SHA256: "6da8bcdb0d45a214cae0e8a88c2987ad48dec134bf04dffb9c05f1354c02b0b4"
  # 官方 MSI 内 ClientGUIx64（= tailscale-ipn.exe）的 SHA256。偏移补丁必须打在完全一致的源文件上。
  TS_ORIG_SHA256: "0c3c56a6626c9f71a32fb307dbda0c810c94a89d66fed158258da6f043004f9c"
  INNO_VERSION: "6.7.3"
  INNO_URL: "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
  # innosetup-6.7.3.exe 的 SHA256（与 jrsoftware/issrc 该 Release 资产的 digest 一致）
  INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ------------------------------------------------------------------
  # 读版本号 + 校验标签。两个构建作业都依赖它，任何不一致都在这里就失败。
  # ------------------------------------------------------------------
  version:
    name: 读取并校验版本号
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 读取 versionName 并与标签比对
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          v=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/build.gradle.kts | head -1)
          test -n "$v" || { echo "::error::未能从 android/build.gradle.kts 读到 versionName"; exit 1; }
          # 版本号会进文件名和 Release 标签，只允许安全字符
          echo "$v" | grep -qE '^[0-9A-Za-z._-]+$' || { echo "::error::versionName 含非法字符: $v"; exit 1; }
          echo "versionName = $v"
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$v" ]; then
              echo "::error::标签 $REF_NAME 与 android/build.gradle.kts 的 versionName ($v) 不一致，应为 v$v。请先改 versionName/versionCode 再打标签。"
              exit 1
            fi
            echo "标签 $REF_NAME 与 versionName 一致"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Android：与 android-release.yml 相同的构建步骤
  # ------------------------------------------------------------------
  android:
    name: 构建 Android APK
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'

      - name: 安装 Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装 Android SDK 与 NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p /opt/android-sdk
          cd /opt/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/
          yes | cmdline-tools/latest/bin/sdkmanager --licenses
          cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "/opt/android-sdk/build-tools/36.0.0" >> $GITHUB_PATH

      # 固定调试密钥签名，保证各版本可覆盖安装（见 android-release.yml 的说明）
      - name: 安装固定调试签名密钥
        run: |
          mkdir -p $HOME/.android
          cp .ci/android-debug.keystore $HOME/.android/debug.keystore
          keytool -list -keystore $HOME/.android/debug.keystore -storepass android | grep androiddebugkey

      - name: 清理
        run: make clean

      - name: 构建 libtailscale
        run: make libtailscale

      - name: 构建全架构 APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp build/outputs/apk/debug/android-debug.apk "../Tailscale-zh-${VERSION}.apk"
          ls -lh "../Tailscale-zh-${VERSION}.apk"

      - name: 校验签名与版本信息
        run: |
          apk="Tailscale-zh-${VERSION}.apk"
          /opt/android-sdk/build-tools/36.0.0/apksigner verify --verbose "$apk"
          badging=$(/opt/android-sdk/build-tools/36.0.0/aapt dump badging "$apk")
          echo "$badging" | grep -E "^package|^sdkVersion|^targetSdkVersion|^native-code|^application-label:"
          # APK 内的 versionName 必须就是本次发版版本号
          echo "$badging" | grep -q "versionName='${VERSION}'" \
            || { echo "::error::APK 内 versionName 与 ${VERSION} 不一致"; exit 1; }

      - name: 上传 APK 产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: Tailscale-zh-${{ env.VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # Windows：用同一提交的 windows/ 目录构建（与 build-pc-installer.yml 相同的步骤）。
  # 自 2026-10-13 起 Windows 源码并入 main 的 windows/，不再检出 pc 分支（pc 仅作归档）。
  # ------------------------------------------------------------------
  windows:
    name: 构建 Windows 安装包
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: windows
    steps:
      - name: 拉取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 记录源码提交
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          Write-Host "Windows 端源码: windows/ @ $sha"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: python -m pip install --disable-pip-version-check --no-cache-dir "capstone==5.0.9"

      - name: Download official Tailscale MSI (pinned SHA256 + Authenticode)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fsSL --proto '=https' --tlsv1.2 -o tailscale-setup.msi "$env:TS_MSI_URL"
          $h = (Get-FileHash tailscale-setup.msi -Algorithm SHA256).Hash.ToLower()
          Write-Host "MSI SHA256: $h"
          if ($h -ne $env:TS_MSI_SHA256.ToLower()) { throw "官方 MSI 哈希不符（期望 $env:TS_MSI_SHA256）—— 拒绝把它打进安装包" }
          $sig = Get-AuthenticodeSignature tailscale-setup.msi
          Write-Host "MSI 签名: $($sig.Status)  $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Tailscale') {
            throw "官方 MSI 的 Authenticode 签名无效或签名者不是 Tailscale"
          }

      - name: Extract tailscale-ipn.exe from MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "7z" }
          Remove-Item -Recurse -Force extract -ErrorAction SilentlyContinue
          & $sevenZip x tailscale-setup.msi "-oextract" -y | Out-Null
          Get-ChildItem extract -File | Format-Table Name, Length

      - name: Verify source hash and stage original exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $want = $env:TS_ORIG_SHA256.ToLower()
          $hit = $null
          Get-ChildItem extract -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            if ($h -eq $want) { $hit = $_.FullName }
          }
          if (-not $hit) { throw "MSI 中未找到 SHA256=$want 的原始 tailscale-ipn.exe" }
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item $hit build\tailscale-ipn.exe
          Write-Host "已定位原始程序: $hit"

      - name: Apply Chinese patch
        run: python tools\build.py build\tailscale-ipn.exe build

      - name: Verify patched binary
        run: python tools\verify.py build\tailscale-ipn.exe build\tailscale-ipn.zh.exe tools\zh_win.tsv

      - name: Verify prebuilt copy is in sync
        run: python tools\prebuilt_check.py build\tailscale-ipn.zh.exe

      - name: Install Inno Setup ${{ env.INNO_VERSION }} (pinned SHA256)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fsSL --proto '=https' --tlsv1.2 -o innosetup.exe "$env:INNO_URL"
          $h = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:INNO_SHA256.ToLower()) { throw "Inno Setup 安装包哈希不符：$h" }
          $p = Start-Process -FilePath .\innosetup.exe -Wait -PassThru -ArgumentList `
               '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/SP-'
          if ($p.ExitCode -ne 0) { throw "Inno Setup 安装失败，退出码 $($p.ExitCode)" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 $iscc" }

      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "installer\tailscale-zh.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败，退出码 $LASTEXITCODE" }
          Get-ChildItem dist | Format-Table Name, Length

      # 安装包内部仍按官方 1.104.1 登记（OutputBaseFilename = Tailscale-zh-1.104.1-setup），
      # 这里只把**对外文件名**换成发版版本号。
      - name: Stage exe with release version label
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exes = @(Get-ChildItem dist -Filter *.exe)
          if ($exes.Count -ne 1) { throw "dist 里应当恰好有 1 个 exe，实际 $($exes.Count) 个" }
          Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force release | Out-Null
          $dst = "release\Tailscale-zh-$env:VERSION-setup.exe"
          Copy-Item $exes[0].FullName $dst
          Get-ChildItem release | Format-Table Name, Length

      - name: 上传 exe 产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-exe
          path: windows/release/*.exe
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # 汇总 + 发布。手动触发时只汇总校验清单、不发布。
  # ------------------------------------------------------------------
  publish:
    name: 发布到 Release
    needs: [version, android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: 拉取代码（取 Release 说明）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - name: 下载两端产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: 检查资产并生成 SHA256SUMS.txt
        run: |
          cd out
          ls -l
          test -f "Tailscale-zh-${VERSION}.apk"        || { echo "::error::缺少 APK"; exit 1; }
          test -f "Tailscale-zh-${VERSION}-setup.exe"  || { echo "::error::缺少 exe"; exit 1; }
          sha256sum "Tailscale-zh-${VERSION}.apk" "Tailscale-zh-${VERSION}-setup.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 上传汇总产物（手动触发时可下载核对）
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ env.VERSION }}
          path: out/*
          retention-days: 7

      - name: 发布 Release（仅标签触发）
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Tailscale 汉化版 ${{ env.VERSION }}（Windows + Android）
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: .github/release-notes.md
          files: |
            out/Tailscale-zh-${{ env.VERSION }}.apk
            out/Tailscale-zh-${{ env.VERSION }}-setup.exe
            out/SHA256SUMS.txt
